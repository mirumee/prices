[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prices"
dynamic = ["version"]
readme = "README.md"
description = "Python price handling for humans"
authors = [{ name = "Mirumee Software", email = "hello@mirumee.com" }]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = ["babel>=2.5.0"]

[project.optional-dependencies]
dev = ["ipdb"]
types = ["mypy>=1.0.0"]
test = ["pytest", "pytest-cov", "coverage[toml]"]

[project.urls]
"Homepage" = "https://github.com/mirumee/prices"
"Repository" = "https://github.com/mirumee/prices"
"Bug Tracker" = "https://github.com/mirumee/prices/issues"

[tool.hatch.build]
include = ["prices/**/*.py"]
exclude = ["tests"]

[tool.hatch.version]
path = "prices/__about__.py"

[tool.hatch.envs.default]
features = ["dev", "test"]

[tool.hatch.envs.default.scripts]
check = ["hatch fmt", "hatch test -a", "hatch test --cover"]

[tool.hatch.envs.hatch-test]
dependencies = ["pytest", "pytest-cov", "coverage[toml]"]

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.10", "3.11", "3.12", "3.13"]

[tool.hatch.envs.types]
features = ["types"]

[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive"

# Tool configuration

## Pytest configuration

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]

## Types configuration

[tool.mypy]
python_version = "3.10"
files = ["prices"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_reexport = true
disable_error_code = ["import-untyped"]

## Coverage configuration

[tool.coverage.run]
source = ["prices", "tests"]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
omit = ["*/__about__.py"]
fail_under = 90

[tool.hatch.envs.coverage]
detached = true
dependencies = ["coverage[toml]"]

[tool.hatch.envs.coverage.scripts]
combine = "coverage combine {args}"
html = "coverage html --skip-covered --skip-empty"
xml = "coverage xml --skip-empty"

## Ruff configuration

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 99

[tool.ruff.lint]
select = ["E", "F", "G", "I", "N", "Q", "UP", "C90", "T20", "TID"]
ignore = ["UP038"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
known-first-party = ["prices"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
